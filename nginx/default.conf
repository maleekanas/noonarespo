# =============================================================================
# Nginx Reverse Proxy Configuration for Kids Arabic Academy
# =============================================================================

# Gzip Compression
gzip on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/js
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
gzip_vary on;
gzip_min_length 1000;

# Upstream Next.js Container
upstream nextjs_upstream {
    server app:3000;
    keepalive 64;
}

# -----------------------------------------------------------------------------
# 1. HTTP Server - ACME Challenge & Permanent HTTPS Redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kidsarabicacademy.com www.kidsarabicacademy.com _;

    # Let's Encrypt ACME Challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2. HTTPS Server - Reverse Proxy with WebSocket & Caching
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kidsarabicacademy.com www.kidsarabicacademy.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/kidsarabicacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidsarabicacademy.com/privkey.pem;

    # SSL Protocols & Ciphers (Modern & Secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Client Request Limits
    client_max_body_size 25M;

    # Next.js Static Asset Caching (Immutable)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Files Caching
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|mp3|wav|ogg|pdf|txt)$ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Reverse Proxy Route
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (Live classroom & real-time communication)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client IP & Host Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
